name: Release

# Publishes a GitHub release with that version's notes from CHANGELOG.md, either when a version tag
# (for example v1.0.0) is pushed, or from the Actions tab ("Run workflow", enter the version), which
# also creates the tag on the latest commit of main.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as in CHANGELOG.md (for example 1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Version and notes from CHANGELOG.md
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version: $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          awk -v v="$v" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then where=(--target "$GITHUB_SHA"); else where=(--verify-tag); fi
          gh release create "v$VERSION" --title "Your Place v$VERSION" --notes-file notes.md "${where[@]}"
